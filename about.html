<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>David Bayón Mateo</title>
    <meta name="description" content="David Bayón Mateo, Graphic and Multimedia Designer based in Madrid." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e2e6e3'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var r = document.documentElement;
        var m = localStorage.getItem("color-mode") || "light";
        if (m === "system")
          m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        r.classList.remove("dark", "light");
        r.classList.add(m, "visible");
        r.setAttribute("data-template", "about");
      })();
    </script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body data-page="about" data-template="about">
    <main class="wrapper no-transition">
      <div class="nav is-responsive" id="nav"></div>
      <div class="content" id="content"></div>
    </main>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
